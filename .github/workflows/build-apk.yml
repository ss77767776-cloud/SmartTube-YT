name: Build SmartTube YT Style APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download restyled source
        run: |
          curl -fL -o source.zip "https://muse.ai/files/1376596115547221/1464569725636570/ct228ekvya5o6vaiw5arvebe/SmartTube-YT-Style-source-v2.zip"
          unzip -q source.zip
      - name: Set up JDK 17 for SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;30.0.3"
      - name: Set up JDK 11 for the build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build APK
        working-directory: SmartTube
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-YT-Style-APK
          path: SmartTube/smarttubetv/build/outputs/apk/ststable/debug/*.apk
          if-no-files-found: error
